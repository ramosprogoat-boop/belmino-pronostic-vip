<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmino Pronostic VIP | Analyses & Paris Sportifs</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-card: #151a24;
            --gold: #f5b942;
            --gold-hover: #e0a32e;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --green: #22c55e;
            --telegram: #229ED9;
            --whatsapp: #25D366;
            --border: #262e3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background-color: rgba(11, 14, 20, 0.95);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--gold);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-gold {
            background-color: var(--gold);
            color: #000;
        }

        .btn-gold:hover {
            background-color: var(--gold-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid var(--gold);
            color: var(--gold);
            background: transparent;
        }
